name: Web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check and deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    env:
      # Empty when the secrets are not set, which is what the deploy step checks.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: node --test tests/*.test.ts

      - name: Check types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ignore-pattern dist --ignore-pattern .next

      - name: Build
        run: npm run build

      # Only runs once the Cloudflare secrets exist, so the checks above still
      # protect pushes from anyone who cannot deploy.
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Say what to do when the secrets are missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice title=No desplegado::Falta el secreto CLOUDFLARE_API_TOKEN. \
          La web se compiló y pasó las comprobaciones, pero no se publicó. \
          Pasos en web/README.md, sección Publicar."
